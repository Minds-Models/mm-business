sensitivities: >
  NEVER approach pet brands with SuperZoo aggregates before the mandate is signed
  (methodology-only talk allowed). Competitor chain = Pet Center — do not mention
  cross-chain benchmarking ambitions yet.
  UPDATED 2026-09-02 (supersedes the 09-01 line, which said flatly "do not pitch Purina or
  Mars"): they STAY on the target list, but as a 2027 conversation and on METHODOLOGY ONLY
  until the conditions in assortment_revenue.when_it_becomes_sellable are met. Two things are
  forbidden in the meantime, and both would be unrecoverable:
  (a) Never tell Mars or Nestlé they are "absent from the premium specialist channel" — it is
      false. Royal Canin distributes specifically through specialists and vets and holds ~30%
      of European high-end; Pro Plan is specialist-exclusive. Their category team knows their
      own numbers. What is zero is Super zoo's receipts, which is Plaček's listing decision.
  (b) Never promise competitor-level cuts from a single chain — at n=1 that is the prohibited
      named-retailer cut, and here the competitor is Plaček's own private label.
  The pet slot's working targets remain VAFO/Brit, Trixie, Spectrum Brands and Hill's, plus
  Plaček's own-brand team as a brand-like buyer (the D1 exception).
