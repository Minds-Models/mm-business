<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Card</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Tokens and paper exactly as the landing page (analytics-assistant-fe/src/styles.css). */
:root{
  --paper:#fbfbfa; --paper-lift:#fff; --dot:rgba(17,24,39,.085);
  --ink:#14161b; --ink-2:#565d6b; --ink-3:#8d94a2; --ink-4:#b3b9c4;
  --hair:rgba(16,24,40,.07); --hair-2:rgba(16,24,40,.11);
  --accent:#2f6df6; --accent-wash:#eef4ff; --accent-edge:#cfe0ff;
  --muted:#dfe3ea; --well:#f4f5f7;
  --sh-2:0 1px 2px rgba(16,24,40,.05),0 10px 26px -10px rgba(16,24,40,.1),0 34px 70px -34px rgba(16,24,40,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);
  font-feature-settings:"cv05" 1,"ss01" 1;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden}
@page{margin:0}

.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background-color:var(--paper);
  background-image:radial-gradient(900px 520px at 50% -18%,#fff 0%,rgba(255,255,255,0) 62%),
                   radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);
  background-size:100% 100%,22px 22px}
.card{position:absolute;inset:var(--m);background:var(--paper-lift);border:1px solid rgba(16,24,40,.055);
  border-radius:26px;box-shadow:var(--sh-2);padding:var(--p);display:flex;flex-direction:column;gap:var(--g)}

.pill{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  background:var(--well);border-radius:999px;padding:6px 12px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
h1{font-size:var(--h1);line-height:1.1;letter-spacing:-.028em;font-weight:600;text-wrap:balance}
.sub{font-size:12.5px;line-height:1.45;color:var(--ink-3);margin-top:8px;text-wrap:pretty;max-width:46ch}
.stat{flex:none;text-align:right}
.stat .v{font-size:var(--sv);font-weight:600;letter-spacing:-.035em;line-height:.95;color:var(--accent);white-space:nowrap}
.stat .l{margin-top:6px;font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);max-width:150px;margin-left:auto;line-height:1.35}

.viz{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}

/* bars: one metric, 2–5 rows */
.bars{display:flex;flex-direction:column;gap:14px}
.bar .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;margin-bottom:6px}
.bar .lab span{font-weight:500;color:var(--ink-3);font-size:11px;margin-left:6px}
.bar .lab b{font-size:15px;font-variant-numeric:tabular-nums}
.bar .tr{height:12px;border-radius:999px;background:var(--well);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:999px;background:var(--muted)}
.bar.hi .tr i{background:var(--accent)}
.bar.hi .lab b{color:var(--accent)}

.bars.dense{gap:8px}.bars.dense .bar .lab{margin-bottom:4px;font-size:12px}.bars.dense .bar .lab b{font-size:13px}.bars.dense .bar .tr{height:9px}
/* pairs: two series per row */
.pairs{display:flex;flex-direction:column;gap:14px}
.pairs .legend{display:flex;gap:14px;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.pairs .legend span{display:inline-flex;align-items:center;gap:6px}
.pairs .legend span:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.pr .lab{font-size:12.5px;font-weight:600;margin-bottom:6px}
.pr .row{display:flex;align-items:center;gap:8px;margin-top:3px}
.pr .row i{display:block;height:9px;border-radius:999px;background:var(--c)}
.pr .row b{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.pairs.dense{gap:8px}.pairs.dense .pr .lab{margin-bottom:2px;font-size:11.5px}.pairs.dense .pr .row{margin-top:2px}.pairs.dense .pr .row i{height:7px}
/* versus: scoreboard */
.vs{background:var(--well);border-radius:20px;padding:22px 18px;text-align:center}
.vs .t{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.vs .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:4px}
.vs .n{font-size:60px;font-weight:600;letter-spacing:-.04em;line-height:1}
.vs .n.hi{color:var(--accent)}
.vs .k{font-size:12px;font-weight:600;color:var(--ink-2)}
.vs .colon{font-size:26px;color:var(--ink-4);font-weight:600}
.vs .note{margin-top:14px;font-size:11px;color:var(--ink-3)}

/* line: 3–6 points, smooth */
.line svg{width:100%;height:auto;overflow:visible}
.line .ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:6px;padding:0 2px}


/* segments: same components as the decks (.mn chip, .faces stack) and the deck's segment bars */
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.faces{display:inline-flex}
.faces .av{width:30px;height:30px;border-radius:50%;background-size:cover;background-position:center top;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(16,24,40,.18)}
.faces .av+.av{margin-left:-9px}
.mn{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;font-size:12.5px;font-weight:600;
  letter-spacing:-.01em;border:1px solid;white-space:nowrap}
.mn i{width:20px;height:20px;border-radius:50%;background-size:cover;background-position:center top;flex:none}
.mn.base{color:var(--ink-2);background:var(--well);border-color:var(--hair-2);padding-left:10px}
.segbars{display:flex;flex-direction:column;gap:13px}
.sb{display:grid;grid-template-columns:auto 1fr 40px;align-items:center;gap:12px}
.sb .tr{height:12px;border-radius:999px;background:var(--well);overflow:hidden}
.sb .tr b{display:block;height:100%;border-radius:999px}
.sb .vl{font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.segbars .scale{font-size:10px;color:var(--ink-3);text-align:right;margin-top:-4px}

/* footer */
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:12px;border-top:1px solid var(--hair)}
.foot .src{font-size:9px;line-height:1.45;color:var(--ink-3);max-width:60%}
.foot .src img{height:9px;display:block;margin-bottom:6px;opacity:.9}
.cta{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;
  font-size:12px;font-weight:600;border-radius:999px;padding:9px 14px 9px 16px;box-shadow:0 6px 16px -8px rgba(47,109,246,.6)}
.cta span{font-size:14px;line-height:1}

/* formats (CSS px; rendered at 2× device scale) */
body.sq{--w:540px;--h:540px;--m:26px;--p:28px;--g:14px;--h1:25px;--sv:46px}
body.pt{--w:540px;--h:675px;--m:26px;--p:30px;--g:18px;--h1:27px;--sv:50px}
body.slide{--w:960px;--h:540px;--m:28px;--p:36px;--g:16px;--h1:30px;--sv:56px}
.slide .body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:center}
.slide .body .left{display:flex;flex-direction:column;gap:18px}
.slide .stat{text-align:left}.slide .stat .l{margin-left:0;max-width:220px}
</style>
</head>
<body>
<div id="root"></div>
<script src="demo.js"></script>
<script>
(() => {
const P = new URLSearchParams(location.search);
const FMT = P.get('fmt') || 'sq';
const card = (window.CARDS || []).find(c => c.id === P.get('id')) || (window.CARDS || [])[0];
const EN = card.lang === 'en';
document.body.className = FMT;
document.documentElement.lang = EN ? 'en' : 'cs';
const PAGE = { sq: '540px 540px', pt: '540px 675px', slide: '960px 540px' }[FMT];
document.head.insertAdjacentHTML('beforeend', `<style>@page{size:${PAGE};margin:0}</style>`);
const nf = v => typeof v === 'number' ? v.toLocaleString(EN ? 'en-GB' : 'cs-CZ', { maximumFractionDigits: 2 }) : v;
const CTA = EN ? 'Try it live' : 'Vyzkoušejte si to živě';
const SRC = { pos: EN ? 'Real data from stores in Czechia · POS + visual data' : 'Reálná data z prodejen v Česku · pokladní a vizuální data',
              visual: EN ? 'Real data from stores in Czechia · visual data' : 'Reálná data z prodejen v Česku · vizuální data' };

const SEGS = window.SEGMENTS || {};
function viz(ch) {
  if (!ch) return '';
  const u = ch.unit ?? '';
  if (ch.type === 'segbars') {
    const max = ch.max ?? Math.max(...ch.rows.map(r => r.v));
    return `<div class="segbars">${ch.rows.map(r => {
      const seg = r.seg ? SEGS[r.seg] : null;
      const chip = seg ? `<span class="mn" style="color:${seg.ink};background:${seg.bg};border-color:${seg.edge}"><i style="background-image:url('${seg.img}')"></i>${seg.label}</span>`
                       : `<span class="mn base">${r.label}</span>`;
      return `<div class="sb">${chip}<span class="tr"><b style="width:${r.v / max * 100}%;background:${seg ? seg.ink : '#b3b9c4'}"></b></span><span class="vl" style="color:${seg ? seg.ink : 'var(--ink-3)'}">${nf(r.v)}${u}</span></div>`;
    }).join('')}${ch.scale ? `<div class="scale">${ch.scale}</div>` : ''}</div>`;
  }
  if (ch.type === 'bars') {
    const max = ch.max ?? Math.max(...ch.rows.map(r => r.v));
    return `<div class="bars${ch.rows.length >= 4 && FMT === 'sq' ? ' dense' : ''}">${ch.rows.map(r => `<div class="bar${r.hi ? ' hi' : ''}">
      <div class="lab"><div>${r.label}${r.note ? `<span>${r.note}</span>` : ''}</div><b>${nf(r.v)}${u}</b></div>
      <div class="tr"><i style="width:${Math.max(2, r.v / max * 100)}%"></i></div></div>`).join('')}</div>`;
  }
  if (ch.type === 'pairs') {
    const max = Math.max(...ch.rows.flatMap(r => [r.a, r.b]));
    return `<div class="pairs${FMT === 'sq' ? ' dense' : ''}"><div class="legend"><span style="--c:var(--accent)">${ch.legend[0]}</span><span style="--c:var(--muted)">${ch.legend[1]}</span></div>
      ${ch.rows.map(r => `<div class="pr"><div class="lab">${r.label}</div>
        <div class="row"><i style="--c:var(--accent);width:${r.a / max * 82}%"></i><b>${nf(r.a)}${u}</b></div>
        <div class="row"><i style="--c:var(--muted);width:${r.b / max * 82}%"></i><b>${nf(r.b)}${u}</b></div></div>`).join('')}</div>`;
  }
  if (ch.type === 'versus') {
    return `<div class="vs"><div class="t">${ch.title}</div><div class="row">
      <div class="side"><div class="n hi">${ch.a.v}</div><div class="k">${ch.a.k}</div></div><div class="colon">:</div>
      <div class="side"><div class="n">${ch.b.v}</div><div class="k">${ch.b.k}</div></div></div>
      ${ch.note ? `<div class="note">${ch.note}</div>` : ''}</div>`;
  }
  if (ch.type === 'line') {
    const W = 460, H = 150, pad = 14, pts = ch.points, n = pts.length;
    const lo = ch.min ?? 0, hi = ch.max ?? Math.max(...pts.map(p => p.v)) * 1.12;
    const X = i => pad + i * (W - 2 * pad) / (n - 1), Y = v => H - 8 - (v - lo) / (hi - lo) * (H - 30);
    const P2 = pts.map((p, i) => [X(i), Y(p.v)]);
    let d = `M${P2[0][0]},${P2[0][1]}`;
    for (let i = 0; i < n - 1; i++) {
      const [x0, y0] = P2[Math.max(0, i - 1)], [x1, y1] = P2[i], [x2, y2] = P2[i + 1], [x3, y3] = P2[Math.min(n - 1, i + 2)];
      d += ` C${x1 + (x2 - x0) / 6},${y1 + (y2 - y0) / 6} ${x2 - (x3 - x1) / 6},${y2 - (y3 - y1) / 6} ${x2},${y2}`;
    }
    const area = `${d} L${P2[n - 1][0]},${H} L${P2[0][0]},${H} Z`;
    const labels = pts.map((p, i) => p.pill ? `<g transform="translate(${P2[i][0]},${P2[i][1] - 18})">
      <rect x="-30" y="-12" width="60" height="22" rx="11" fill="${p.hi ? '#2f6df6' : '#14161b'}"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" font-family="Instrument Sans">${nf(p.v)}${u}</text></g>` : '').join('');
    return `<div class="line"><svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2f6df6" stop-opacity=".18"/><stop offset="1" stop-color="#2f6df6" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="#2f6df6" stroke-width="3.5" stroke-linecap="round"/>
      ${P2.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="#2f6df6" stroke-width="2.5"/>`).join('')}${labels}</svg>
      <div class="ax">${pts.map(p => `<span>${p.x}</span>`).join('')}</div></div>`;
  }
  return '';
}

const stat = card.stat ? `<div class="stat"><div class="v">${card.stat.v}</div><div class="l">${card.stat.l}</div></div>` : '';
const foot = `<div class="foot"><div class="src"><img src="assets/logos/mm-wordmark.png" alt="Minds &amp; Models">${SRC[card.data]}${card.n ? ` · ${card.n}` : ''}</div>
  <a class="cta" href="https://chat.mindsmodels.ai">${CTA} <span>→</span></a></div>`;
const faces = card.faces ? `<span class="faces">${card.faces.map(k => `<span class="av" style="background-image:url('${SEGS[k].img}')"></span>`).join('')}</span>` : '';
const pill = `<div class="toprow"><div class="pill">${card.pill}</div>${faces}</div>`;
const titleBlock = `<div><h1>${card.headline}</h1>${card.sub ? `<p class="sub">${card.sub}</p>` : ''}</div>`;

let html;
if (FMT === 'slide') {
  html = `<div class="card">${pill}<div class="body"><div class="left">${titleBlock}${stat}</div><div class="viz">${viz(card.chart)}</div></div>${foot}</div>`;
} else {
  html = `<div class="card">${pill}<div class="head">${titleBlock}${FMT === 'pt' ? '' : stat}</div>${FMT === 'pt' ? `<div class="head" style="justify-content:flex-start">${stat.replace('class="stat"', 'class="stat" style="text-align:left"')}</div>` : ''}<div class="viz">${viz(card.chart)}</div>${foot}</div>`;
}
document.getElementById('root').innerHTML = `<div class="stage">${html}</div>`;
document.title = `${card.id} · ${FMT}`;
if (P.get('check')) {
  const c = document.querySelector('.card').getBoundingClientRect();
  const out = [...document.querySelectorAll('.card *')].filter(e => { const r = e.getBoundingClientRect(); return r.width && (r.right > c.right - 2 || r.bottom > c.bottom - 2 || r.left < c.left); }).map(e => e.className || e.tagName);
  const h1 = document.querySelector('h1'); const lh = parseFloat(getComputedStyle(h1).lineHeight);
  const viz = document.querySelector('.viz'); const vz = viz.getBoundingClientRect(); const kid = viz.firstElementChild?.getBoundingClientRect();
  document.body.setAttribute('data-check', JSON.stringify({ overflow: [...new Set(out)].slice(0, 6), h1Lines: Math.round(h1.getBoundingClientRect().height / lh), vizFree: kid ? Math.round(vz.height - kid.height) : null }));
}
})();
</script>
</body>
</html>
