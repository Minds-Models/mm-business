<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Card</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Tokens and paper exactly as the landing page (analytics-assistant-fe/src/styles.css). */
:root{
  --paper:#fbfbfa; --paper-lift:#fff; --dot:rgba(17,24,39,.085);
  --ink:#14161b; --ink-2:#565d6b; --ink-3:#8d94a2; --ink-4:#b3b9c4;
  --hair:rgba(16,24,40,.07); --hair-2:rgba(16,24,40,.11);
  --accent:#6f9ae8; --accent-ink:#1e40af; --blue-2:#a9c2f0; --blue-3:#d6e3fa; --blue-deep:#2c4f9e; --accent-wash:#eef4ff; --accent-edge:#cfe0ff;
  --muted:#dfe3ea; --well:#f4f5f7;
  --sh-2:0 1px 2px rgba(16,24,40,.05),0 10px 26px -10px rgba(16,24,40,.1),0 34px 70px -34px rgba(16,24,40,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);
  font-feature-settings:"cv05" 1,"ss01" 1;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden}
@page{margin:0}

.stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;background-color:var(--paper);
  background-image:radial-gradient(900px 520px at 50% -18%,#fff 0%,rgba(255,255,255,0) 62%),
                   radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);
  background-size:100% 100%,22px 22px}
.card{position:absolute;inset:var(--m);background:var(--paper-lift);border:1px solid rgba(16,24,40,.055);
  border-radius:26px;box-shadow:var(--sh-2);padding:var(--p);display:flex;flex-direction:column;gap:var(--g)}

.pill{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  background:var(--well);border-radius:999px;padding:6px 12px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.q{font-size:13px;line-height:1.4;font-weight:500;color:var(--ink-2);margin-bottom:8px}
h1{font-size:var(--h1);line-height:1.1;letter-spacing:-.028em;font-weight:600;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-size:12.5px;line-height:1.45;color:var(--ink-3);margin-top:8px;text-wrap:pretty;max-width:46ch}
.stat{flex:none;text-align:right}
.stat .v{font-size:var(--sv);font-weight:600;letter-spacing:-.035em;line-height:.95;color:var(--accent);white-space:nowrap}
.stat .l{margin-top:6px;font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);max-width:150px;margin-left:auto;line-height:1.35}

.viz{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}

/* bars: one metric, 2–5 rows */
.bars{display:flex;flex-direction:column;gap:14px}
.bar .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;margin-bottom:6px}
.bar .lab span{font-weight:500;color:var(--ink-3);font-size:11px;margin-left:6px}
.bar .lab b{font-size:15px;font-variant-numeric:tabular-nums}
.bar .tr{height:10px;border-radius:999px;background:#eef0f3;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:999px;background:var(--muted)}
.bar.hi .tr i{background:var(--accent)}
.bar.hi .lab b{color:var(--accent)}

.bars.dense{gap:8px}.bars.dense .bar .lab{margin-bottom:4px;font-size:12px}.bars.dense .bar .lab b{font-size:13px}.bars.dense .bar .tr{height:9px}
/* pairs: two series per row */
.pairs{display:flex;flex-direction:column;gap:14px}
.pairs .legend{display:flex;gap:14px;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.pairs .legend span{display:inline-flex;align-items:center;gap:6px}
.pairs .legend span:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.pr .lab{font-size:12.5px;font-weight:600;margin-bottom:6px}
.pr .row{display:flex;align-items:center;gap:8px;margin-top:3px}
.pr .row i{display:block;height:9px;border-radius:999px;background:var(--c)}
.pr .row b{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.pairs.dense{gap:8px}.pairs.dense .pr .lab{margin-bottom:2px;font-size:11.5px}.pairs.dense .pr .row{margin-top:2px}.pairs.dense .pr .row i{height:7px}
/* versus: scoreboard */
.vs{background:var(--well);border-radius:20px;padding:22px 18px;text-align:center}
.vs .t{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.vs .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:4px}
.vs .n{font-size:60px;font-weight:600;letter-spacing:-.04em;line-height:1}
.vs .n.hi{color:var(--accent)}
.vs .k{font-size:12px;font-weight:600;color:var(--ink-2)}
.vs .colon{font-size:26px;color:var(--ink-4);font-weight:600}
.vs .note{margin-top:14px;font-size:11px;color:var(--ink-3)}

/* line: 3–6 points, smooth */
.line svg{width:100%;height:auto;overflow:visible}
.line .ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:6px;padding:0 2px}


/* segments: same components as the decks (.mn chip, .faces stack) and the deck's segment bars */
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.faces{display:inline-flex}
.faces .av{width:30px;height:30px;border-radius:50%;background-color:#fff;background-size:cover;background-position:center top;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(16,24,40,.18)}
.faces .av+.av{margin-left:-9px}
.mn{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;font-size:12.5px;font-weight:600;
  letter-spacing:-.01em;border:1px solid;white-space:nowrap}
.mn i{width:20px;height:20px;border-radius:50%;background-size:cover;background-position:center top;flex:none}
.mn.base{color:var(--ink-2);background:var(--well);border-color:var(--hair-2);padding-left:10px}
.segbars{display:grid;grid-template-columns:max-content 1fr auto;column-gap:12px;row-gap:12px;align-items:center}
.sb{display:contents}
.sb .tr{height:10px;border-radius:999px;background:#eef0f3;overflow:hidden}
.sb .tr b{display:block;height:100%;border-radius:999px}
.sb .vl{font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.segbars .scale{grid-column:1/-1;font-size:10px;color:var(--ink-3);text-align:right;margin-top:-2px}

.lists{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lst{background:var(--well);border-radius:16px;padding:12px 14px}
.lst .t{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.lst .it{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--hair);font-size:13px;font-weight:600}
.lst .it:first-of-type{border-top:0}
.lst .it .r{color:var(--ink-4);font-size:11px}.lst .it .v{font-variant-numeric:tabular-nums;color:var(--accent)}
.lst.plain .it .v{color:var(--ink-2)}
.segpairs{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:11px;align-items:center}
.segpairs .lg{grid-column:1/-1;display:flex;gap:14px;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.segpairs .lg span{display:inline-flex;align-items:center;gap:6px}.segpairs .lg span:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.segpairs .two{display:flex;flex-direction:column;gap:4px}
.segpairs .ln{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center}
.segpairs .ln .tr{height:8px;border-radius:999px;background:#eef0f3;overflow:hidden}.segpairs .ln .tr b{display:block;height:100%;border-radius:999px}
.segpairs .ln .v{font-size:11.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.segpairs .scale{grid-column:1/-1;font-size:10px;color:var(--ink-3);text-align:right}
.sq .segpairs{row-gap:8px}

/* inline segment tags inside text */
h1 .mn,.sub .mn,.q .mn,.stat .l .mn{display:inline-block;vertical-align:baseline;line-height:1.25;white-space:nowrap;letter-spacing:-.01em}
h1 .mn{font-size:.66em;padding:.08em .55em .08em .16em}
.sub .mn,.q .mn,.stat .l .mn{font-size:.95em;padding:0 .5em 0 .12em}
h1 .mn i,.sub .mn i,.q .mn i,.stat .l .mn i{display:inline-block;vertical-align:-.32em;width:1.35em;height:1.35em;margin-right:.32em}
/* dumbbell: without → with */
.db{display:grid;grid-template-columns:max-content 1fr;column-gap:14px;row-gap:12px;align-items:center}
.db .lg{grid-column:1/-1;display:flex;gap:16px;font-size:11px;font-weight:600;color:var(--ink-2)}
.db .lg span{display:inline-flex;align-items:center;gap:6px}
.db .lg .o{width:10px;height:10px;border-radius:50%;border:2px solid var(--blue-2);background:#fff}.db .lg .f{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.db .tk{position:relative;height:26px}
.db .tk .rail{position:absolute;left:-8px;right:0;top:12.5px;height:2px;border-radius:2px;background:#e6e9ee}
.db .tk .gl{position:absolute;top:0;bottom:-12px;border-left:1px dashed #e6e9ee}
.db .ax{position:relative;height:12px;margin-top:-6px}.db .ax span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--ink-3)}
.db .tk .ln{position:absolute;top:12px;height:3px;border-radius:3px}
.db .tk .a,.db .tk .b{position:absolute;top:6px;width:14px;height:14px;border-radius:50%;margin-left:-7px}
.db .tk .a{background:#fff;border:2.5px solid var(--blue-2)}
.db .tk .dv{position:absolute;top:-2px;font-size:11.5px;font-weight:700;white-space:nowrap;transform:translateX(10px)}
.db .scale{grid-column:1/-1;font-size:10px;color:var(--ink-3);text-align:right}
/* butterfly */
.bf{display:grid;grid-template-columns:1fr max-content 1fr;column-gap:10px;row-gap:11px;align-items:center}
.bf .hd{font-size:13px;font-weight:700}.bf .hd.l{text-align:right;color:var(--accent-ink)}.bf .hd.r{color:var(--blue-deep)}
.bf .side{display:flex;align-items:center;gap:6px}.bf .side.l{justify-content:flex-end}
.bf .side i{display:block;height:12px;border-radius:999px}.bf .side b{font-size:11.5px;font-variant-numeric:tabular-nums}
.bf .mid{display:flex;justify-content:center}
.bf .scale{grid-column:1/-1;font-size:10px;color:var(--ink-3);text-align:center}
/* split bars: share of 100 */
.sp{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:12px;align-items:center;position:relative}
.sp .bar100{position:relative;height:22px;border-radius:8px;background:#eef0f3;overflow:hidden}
.sp .bar100 b{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.sp .bar100 span{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.sp .avg{position:absolute;top:-6px;bottom:-6px;border-left:1.5px dashed var(--ink-3)}
.sp .scale{grid-column:1/-1;display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3)}
/* figures: 10 people per segment */
.fg{display:grid;grid-template-columns:max-content 1fr auto;column-gap:12px;row-gap:11px;align-items:center}
.fg .ppl{display:flex;gap:3px}
.fg .ppl svg{width:14px;height:20px}
.fg .vl{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fg .scale{grid-column:1/-1;font-size:10px;color:var(--ink-3);text-align:right}
/* day strip */
.ds .lg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:6px;font-size:11px;color:var(--ink-3);align-items:center}
.ds svg{width:100%;height:auto;overflow:visible}
.ds .ax{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-top:4px}
/* persona profile */
.pf{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.pf .who{display:flex;flex-direction:column;align-items:center;gap:8px}
.pf .big{width:84px;height:84px;background-color:#fff;border-radius:50%;background-size:cover;background-position:center top;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--c),0 10px 24px -10px rgba(16,24,40,.35)}
.pf .attrs{display:flex;flex-direction:column;gap:7px}
.pf .t{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pf .chips{display:flex;flex-wrap:wrap;gap:6px}
.pf .ch{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;font-weight:600;background:var(--well);border:1px solid var(--hair-2);border-radius:999px;padding:4px 10px}
.pf .ch b{color:var(--accent-ink);font-variant-numeric:tabular-nums}
/* grid of 100 */
.g100{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.g100 .cells{display:grid;grid-template-columns:repeat(10,13px);gap:4px}
.g100 .cells i{width:13px;height:13px;border-radius:4px;background:#e3e6eb}.g100 .cells i.on{background:var(--accent)}
.g100 .cap{display:flex;flex-direction:column;gap:10px}.g100 .cap div{font-size:12px;color:var(--ink-2);line-height:1.35}.g100 .cap b{display:block;font-size:30px;letter-spacing:-.03em;color:var(--ink)}
.pp{display:flex;flex-direction:column;gap:12px;background:var(--paper-lift);border:1px solid rgba(16,24,40,.055);border-radius:18px;box-shadow:var(--sh-1);padding:14px 16px}
.pp .hd{display:flex;align-items:center;gap:14px}
.pp .av{width:62px;height:62px;border-radius:50%;flex:none;background:#fff center top/cover no-repeat;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--accent-edge)}
.pp .share{white-space:nowrap;font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.pp .cnt{white-space:nowrap;font-size:10.5px;color:var(--ink-4);font-weight:500;margin-top:3px}
.pp .nm{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.pp .rl{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.pp .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--hair);padding-top:10px}
.pp .t{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.pp ul{list-style:none;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2)}
.pp li{padding-left:12px;position:relative;line-height:1.35}
.pp li::before{content:'';position:absolute;left:2px;top:6px;width:4px;height:4px;border-radius:50%;background:var(--ink-4)}
.pp li b{color:var(--accent-ink);font-weight:600;font-variant-numeric:tabular-nums}
/* footer */
.wm-top{height:11px;opacity:.9}
.foot .faces{margin-bottom:6px}
.foot .faces .av{width:26px;height:26px;background-color:#fff}
.foot .faces .av+.av{margin-left:-10px}
.foot .real{font-size:9.5px;color:var(--ink-2);font-weight:500}
.foot .smp{font-size:8.5px;color:var(--ink-3);margin-top:2px}

.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:12px;border-top:1px solid var(--hair)}
.foot .src{font-size:9px;line-height:1.45;color:var(--ink-3);max-width:60%}
.foot .src img{height:9px;display:block;margin-bottom:6px;opacity:.9}
.cta{flex:none;display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;text-decoration:none;
  border-radius:16px;padding:8px 12px 8px 14px;box-shadow:0 8px 18px -10px rgba(111,154,232,.9)}
.cta .t{display:flex;flex-direction:column;line-height:1.15}
.cta .t b{font-size:12px;font-weight:600}.cta .t small{font-size:10px;font-weight:500;opacity:.92}
.cta .ar{font-size:15px;line-height:1}

/* formats (CSS px; rendered at 2× device scale) */
body.sq{--w:540px;--h:540px;--m:24px;--p:26px;--g:12px;--h1:22px;--sv:40px}
.sq .segbars{row-gap:9px}.sq .mn{font-size:11.5px}.sq .mn i{width:18px;height:18px}.sq .sb .tr{height:10px}.sq .q{font-size:12px;margin-bottom:6px}.sq .vs{padding:16px 14px}.sq .vs .n{font-size:50px}
body.pt{--w:540px;--h:675px;--m:26px;--p:30px;--g:18px;--h1:23px;--sv:50px}
body.slide{--w:960px;--h:540px;--m:28px;--p:36px;--g:16px;--h1:25px;--sv:56px}
.slide .body{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center}
.slide .body .left{display:flex;flex-direction:column;gap:18px}
.slide .stat{text-align:left}.slide .stat .l{margin-left:0;max-width:220px}
</style>
</head>
<body>
<div id="root"></div>
<script src="cards.js"></script>
<script>
(() => {
const P = new URLSearchParams(location.search);
const FMT = P.get('fmt') || 'sq';
const card = (window.CARDS || []).find(c => c.id === P.get('id')) || (window.CARDS || [])[0];
const EN = card.lang === 'en';
document.body.className = FMT;
document.documentElement.lang = EN ? 'en' : 'cs';
const PAGE = { sq: '540px 540px', pt: '540px 675px', slide: '960px 540px' }[FMT];
document.head.insertAdjacentHTML('beforeend', `<style>@page{size:${PAGE};margin:0}</style>`);
const nf = v => typeof v === 'number' ? v.toLocaleString(EN ? 'en-GB' : 'cs-CZ', { maximumFractionDigits: 2 }) : v;
const CTA = EN ? 'Try it live' : 'Vyzkoušejte si to živě';
const SRC = { pos: EN ? 'Real data from stores in Czechia · POS + visual data' : 'Reálná data z prodejen v Česku · pokladní a vizuální data',
              visual: EN ? 'Real data from stores in Czechia · visual data' : 'Reálná data z prodejen v Česku · vizuální data',
              sample: EN ? 'Sample answer from chat.mindsmodels.ai · POS + visual data' : 'Ukázka odpovědi z chat.mindsmodels.ai · pokladní a vizuální data' };

const SEGS = window.SEGMENTS || {};
const TAGFILL = P.get('fill') !== '0';
const labelOf = g => EN && g.labelEn ? g.labelEn : g.label;
const tagify = str => (str || '').replace(/\[\[([a-z0-9_]+)\]\]/g, (m, k) => SEGS[k] ? chipOf(k) : m);
const chipOf = k => { const g = SEGS[k]; return `<span class="mn" style="color:${g.ink};background:${TAGFILL ? g.bg : '#fff'};border-color:${g.edge}"><i style="background-image:url('${g.img}');background-color:#fff;background-repeat:no-repeat;background-size:${g.bgs || 'cover'};background-position:${g.bgs ? 'center bottom' : 'center top'}"></i><span class="nm">${labelOf(g)}</span></span>`; };
function viz(ch) {
  if (!ch) return '';
  const u = ch.unit ?? '';
  if (ch.type === 'dumbbell') {
    const max = ch.max ?? Math.max(...ch.rows.map(r => Math.max(r.a, r.b))), X = v => v / max * 88, ticks = ch.ticks ?? [0, max / 4, max / 2, max * 3 / 4, max];
    return `<div class="db"><div class="lg"><span><i class="o"></i>${ch.legend[0]}</span><span><i class="f"></i>${ch.legend[1]}</span></div>
      ${ch.rows.map(r => { const g = SEGS[r.seg], lo = Math.min(r.a, r.b), hi = Math.max(r.a, r.b), d = Math.round((r.b / r.a - 1) * 100);
        return `${chipOf(r.seg)}<div class="tk"><span class="rail"></span>${ticks.map(t => `<span class="gl" style="left:${X(t)}%"></span>`).join('')}<span class="ln" style="left:${X(lo)}%;width:${X(hi) - X(lo)}%;background:var(--blue-2)"></span>
          <span class="a" style="left:${X(r.a)}%"></span><span class="b" style="left:${X(r.b)}%;background:var(--accent)"></span>
          <span class="dv" style="left:${X(Math.max(r.a, r.b))}%;color:var(--accent-ink)">${d > 0 ? '+' : ''}${d} %</span></div>`; }).join('')}
      <div></div><div class="ax">${ticks.map(t => `<span style="left:${X(t)}%">${nf(t)}${u}</span>`).join('')}</div>
      ${ch.scale ? `<div class="scale">${ch.scale}</div>` : ''}</div>`;
  }
  if (ch.type === 'butterfly') {
    const max = ch.max ?? Math.max(...ch.rows.flatMap(r => [r.a, r.b]));
    return `<div class="bf"><div class="hd l">${ch.legend[0]}</div><div></div><div class="hd r">${ch.legend[1]}</div>
      ${ch.rows.map(r => `<div class="side l"><b style="color:${r.a >= r.b ? 'var(--accent-ink)' : 'var(--ink-3)'}">${nf(r.a)}${u}</b><i style="width:${r.a / max * 100}%;background:${r.a >= r.b ? 'var(--accent)' : 'var(--blue-3)'}"></i></div>
        <div class="mid">${chipOf(r.seg)}</div>
        <div class="side r"><i style="width:${r.b / max * 100}%;background:${r.b > r.a ? 'var(--blue-deep)' : 'var(--blue-3)'}"></i><b style="color:${r.b > r.a ? 'var(--blue-deep)' : 'var(--ink-3)'}">${nf(r.b)}${u}</b></div>`).join('')}
      ${ch.scale ? `<div class="scale">${ch.scale}</div>` : ''}</div>`;
  }
  if (ch.type === 'split') {
    return `<div class="sp">${ch.rows.map(r => { const g = SEGS[r.seg], out = r.v < 18;
        return `${chipOf(r.seg)}<div class="bar100"><b style="width:${Math.max(r.v, 1.2)}%;background:${r.hi ? 'var(--accent)' : 'var(--blue-2)'}"></b>
          <span style="${out ? `left:calc(${Math.max(r.v, 1.2)}% + 8px);color:var(--accent-ink)` : 'left:10px;color:#fff'}">${nf(r.v)} %</span>
          ${ch.avg != null ? `<span class="avg" style="left:${ch.avg}%"></span>` : ''}</div>`; }).join('')}
      <div class="scale"><span>${ch.left}</span><span>${ch.avg != null ? `┆ ${ch.avgLabel}` : ''}</span><span>${ch.right}</span></div></div>`;
  }
  if (ch.type === 'figures') {
    const person = (col) => `<svg viewBox="0 0 14 20"><circle cx="7" cy="4" r="3.4" fill="COL"/><path d="M1.5 19.5v-6.2c0-3.4 2.4-5.6 5.5-5.6s5.5 2.2 5.5 5.6v6.2z" fill="COL"/></svg>`.replace(/COL/g, col);
    return `<div class="fg">${ch.rows.map(r => { const g = SEGS[r.seg], filled = r.v / 10;
        const ppl = Array.from({ length: 10 }, (_, i) => { const f = Math.max(0, Math.min(1, filled - i));
          const col = r.hi ? '#6f9ae8' : '#a9c2f0'; if (f >= 0.99) return person(col); if (f <= 0.01) return person('#e3e8f0');
          return `<span style="position:relative;display:inline-block;width:14px;height:20px">${person('#e3e8f0')}<span style="position:absolute;inset:0;width:${f * 100}%;overflow:hidden">${person(col)}</span></span>`; }).join('');
        return `${chipOf(r.seg)}<div class="ppl">${ppl}</div><span class="vl" style="color:${r.hi ? 'var(--accent-ink)' : 'var(--ink-3)'}">${nf(Math.round(r.v / 10 * 2) / 2)} z 10</span>`; }).join('')}
      ${ch.scale ? `<div class="scale">${ch.scale}</div>` : ''}</div>`;
  }
  if (ch.type === 'daystrip') {
    const W = 460, H = 130, n = 24, X = i => 6 + i * (W - 12) / (n - 1), Y = v => H - 6 - v / (ch.max ?? 100) * (H - 22);
    const path = pts => { const P2 = pts.map((v, i) => [X(i), Y(v)]); let d = `M${P2[0][0]},${P2[0][1]}`;
      for (let i = 0; i < n - 1; i++) { const [x0, y0] = P2[Math.max(0, i - 1)], [x1, y1] = P2[i], [x2, y2] = P2[i + 1], [x3, y3] = P2[Math.min(n - 1, i + 2)];
        d += ` C${x1 + (x2 - x0) / 6},${y1 + (y2 - y0) / 6} ${x2 - (x3 - x1) / 6},${y2 - (y3 - y1) / 6} ${x2},${y2}`; } return d; };
    const BL = ['#6f9ae8', '#2c4f9e'];
    const svg = ch.series.map((s, si) => { const g = { ink: BL[si % 2] }, d = path(s.pts), pk = s.pts.indexOf(Math.max(...s.pts));
      return `<path d="${d} L${X(n - 1)},${H} L${X(0)},${H} Z" fill="${g.ink}" opacity=".10"/><path d="${d}" fill="none" stroke="${g.ink}" stroke-width="3" stroke-linecap="round"/>
        <g transform="translate(${Math.min(Math.max(X(pk), 26), W - 26)},${Y(s.pts[pk]) - 14})"><rect x="-24" y="-11" width="48" height="20" rx="10" fill="${g.ink}"/>
        <text x="0" y="3.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Instrument Sans">${s.pts[pk]} %</text></g>`; }).join('');
    return `<div class="ds"><div class="lg">${ch.series.map((s, si) => `<span style="display:inline-flex;align-items:center;gap:6px"><i style="display:inline-block;width:16px;height:3.5px;border-radius:2px;background:${BL[si % 2]}"></i>${chipOf(s.seg)}<span>${s.note}</span></span>`).join('')}</div>
      <svg viewBox="0 0 ${W} ${H}">${[0, 6, 12, 18, 23].map(h => `<line x1="${X(h)}" x2="${X(h)}" y1="4" y2="${H}" stroke="#eef0f3"/>`).join('')}${svg}</svg>
      <div class="ax"><span>0 h</span><span>6 h</span><span>12 h</span><span>18 h</span><span>24 h</span></div></div>`;
  }
  if (ch.type === 'profile') {
    const g = SEGS[ch.seg];
    return `<div class="pf"><div class="who"><div class="big" style="--c:var(--accent);background-image:url('${g.img}')"></div>${chipOf(ch.seg)}</div>
      <div class="attrs">${ch.groups.map(gr => `<div class="t">${gr.title}</div><div class="chips">${gr.items.map(it => `<span class="ch">${it.label}<b>${it.v}</b></span>`).join('')}</div>`).join('')}</div></div>`;
  }
  if (ch.type === 'grid100') {
    return `<div class="g100"><div class="cells">${Array.from({ length: 100 }, (_, i) => `<i class="${i < ch.on ? 'on' : ''}"></i>`).join('')}</div>
      <div class="cap">${ch.caps.map(c => `<div><b>${c.v}</b>${c.l}</div>`).join('')}</div></div>`;
  }
  if (ch.type === 'persona') {
    const g = SEGS[ch.seg];
    return `<div class="pp"><div class="hd"><span class="av" style="background-image:url('${g.img}')"></span>
      <div style="flex:none"><div class="share">${ch.share}</div><div class="cnt">${ch.shareLabel}</div></div>
      <div style="margin-left:6px"><div class="nm">${labelOf(g)}</div><div class="rl">${ch.role}</div></div></div>
      <div class="cols">${ch.cols.map(c => `<div><div class="t">${c.title}</div><ul>${c.items.map(it => `<li>${it}</li>`).join('')}</ul></div>`).join('')}</div></div>`;
  }
  if (ch.type === 'lists') {
    return `<div class="lists">${ch.cols.map((c, ci) => `<div class="lst${ci ? ' plain' : ''}"><div class="t">${c.title}</div>${c.rows.map((r, i) => `<div class="it"><span class="r">${i + 1}</span><span>${r.label}</span><span class="v">${nf(r.v)}${c.unit ?? ''}</span></div>`).join('')}</div>`).join('')}</div>`;
  }
  if (ch.type === 'segpairs') {
    const max = ch.max ?? Math.max(...ch.rows.flatMap(r => [r.a, r.b]));
    return `<div class="segpairs"><div class="lg"><span style="--c:var(--accent)">${ch.legend[0]}</span><span style="--c:#c3c9d3">${ch.legend[1]}</span></div>
      ${ch.rows.map(r => `${chipOf(r.seg)}<div class="two">
        <div class="ln"><span class="tr"><b style="width:${r.a / max * 100}%;background:var(--accent)"></b></span><span class="v" style="color:var(--accent-ink)">${nf(r.a)}${u}</span></div>
        <div class="ln"><span class="tr"><b style="width:${r.b / max * 100}%;background:#c3c9d3"></b></span><span class="v" style="color:var(--ink-3)">${nf(r.b)}${u}</span></div></div>`).join('')}
      ${ch.scale ? `<div class="scale">${ch.scale}</div>` : ''}</div>`;
  }
  if (ch.type === 'segbars') {
    const max = ch.max ?? Math.max(...ch.rows.map(r => r.v));
    return `<div class="segbars">${ch.rows.map(r => {
      const seg = r.seg ? SEGS[r.seg] : null;
      const chip = seg ? chipOf(r.seg)
                       : `<span class="mn base">${r.label}</span>`;
      return `<div class="sb">${chip}<span class="tr"><b style="width:${r.v / max * 100}%;background:${!seg ? '#d3d8e0' : r.hi ? 'var(--accent)' : 'var(--blue-2)'}"></b></span><span class="vl" style="color:${seg && r.hi ? 'var(--accent-ink)' : 'var(--ink-3)'}">${ch.plus && r.v > 0 ? '+' : ''}${nf(r.v)}${r.u ?? u}</span></div>`;
    }).join('')}${ch.scale ? `<div class="scale">${ch.scale}</div>` : ''}</div>`;
  }
  if (ch.type === 'bars') {
    const max = ch.max ?? Math.max(...ch.rows.map(r => r.v));
    return `<div class="bars${ch.rows.length >= 4 && FMT === 'sq' ? ' dense' : ''}">${ch.rows.map(r => `<div class="bar${r.hi ? ' hi' : ''}">
      <div class="lab"><div>${r.label}${r.note ? `<span>${r.note}</span>` : ''}</div><b>${nf(r.v)}${u}</b></div>
      <div class="tr"><i style="width:${Math.max(2, r.v / max * 100)}%"></i></div></div>`).join('')}</div>`;
  }
  if (ch.type === 'pairs') {
    const max = Math.max(...ch.rows.flatMap(r => [r.a, r.b]));
    return `<div class="pairs${FMT === 'sq' ? ' dense' : ''}"><div class="legend"><span style="--c:var(--accent)">${ch.legend[0]}</span><span style="--c:var(--muted)">${ch.legend[1]}</span></div>
      ${ch.rows.map(r => `<div class="pr"><div class="lab">${r.label}</div>
        <div class="row"><i style="--c:var(--accent);width:${r.a / max * 82}%"></i><b>${nf(r.a)}${u}</b></div>
        <div class="row"><i style="--c:var(--muted);width:${r.b / max * 82}%"></i><b>${nf(r.b)}${u}</b></div></div>`).join('')}</div>`;
  }
  if (ch.type === 'versus') {
    return `<div class="vs"><div class="t">${ch.title}</div><div class="row">
      <div class="side"><div class="n hi">${ch.a.v}</div>${ch.a.seg ? chipOf(ch.a.seg) : `<div class="k">${ch.a.k}</div>`}</div><div class="colon">:</div>
      <div class="side"><div class="n">${ch.b.v}</div>${ch.b.seg ? chipOf(ch.b.seg) : `<div class="k">${ch.b.k}</div>`}</div></div>
      ${ch.note ? `<div class="note">${ch.note}</div>` : ''}</div>`;
  }
  if (ch.type === 'line') {
    const W = 460, H = 150, pad = 14, pts = ch.points, n = pts.length;
    const lo = ch.min ?? 0, hi = ch.max ?? Math.max(...pts.map(p => p.v)) * 1.12;
    const X = i => pad + i * (W - 2 * pad) / (n - 1), Y = v => H - 8 - (v - lo) / (hi - lo) * (H - 30);
    const P2 = pts.map((p, i) => [X(i), Y(p.v)]);
    let d = `M${P2[0][0]},${P2[0][1]}`;
    for (let i = 0; i < n - 1; i++) {
      const [x0, y0] = P2[Math.max(0, i - 1)], [x1, y1] = P2[i], [x2, y2] = P2[i + 1], [x3, y3] = P2[Math.min(n - 1, i + 2)];
      d += ` C${x1 + (x2 - x0) / 6},${y1 + (y2 - y0) / 6} ${x2 - (x3 - x1) / 6},${y2 - (y3 - y1) / 6} ${x2},${y2}`;
    }
    const area = `${d} L${P2[n - 1][0]},${H} L${P2[0][0]},${H} Z`;
    const labels = pts.map((p, i) => p.pill ? `<g transform="translate(${P2[i][0]},${P2[i][1] - 18})">
      <rect x="-30" y="-12" width="60" height="22" rx="11" fill="${p.hi ? '#6f9ae8' : '#14161b'}"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" font-family="Instrument Sans">${nf(p.v)}${u}</text></g>` : '').join('');
    return `<div class="line"><svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6f9ae8" stop-opacity=".18"/><stop offset="1" stop-color="#6f9ae8" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="#6f9ae8" stroke-width="3.5" stroke-linecap="round"/>
      ${P2.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="#6f9ae8" stroke-width="2.5"/>`).join('')}${labels}</svg>
      <div class="ax">${pts.map(p => `<span>${p.x}</span>`).join('')}</div></div>`;
  }
  return '';
}

const stat = false && card.stat ? `<div class="stat"><div class="v">${card.stat.v}</div><div class="l">${card.stat.l}</div></div>` : '';
const faces = card.faces ? `<span class="faces">${card.faces.map(k => `<span class="av" style="background-image:url('${SEGS[k].img}')"></span>`).join('')}</span>` : '';
const REAL = EN ? 'Based on real shopper data from real stores<br>in CZ and SK (visual + POS)' : 'Vychází z reálných dat o nakupujících z prodejen<br>v ČR a SR (vizuální + pokladní data)';
const foot = `<div class="foot"><div class="src"><div class="real">${REAL}</div>${card.data === 'sample' ? `<div class="smp">${EN ? 'Sample answer from chat.mindsmodels.ai' : 'Ukázka odpovědi z chat.mindsmodels.ai'}</div>` : ''}</div>
  <a class="cta" href="https://chat.mindsmodels.ai"><span class="t"><b>${CTA}</b><small>chat.mindsmodels.ai</small></span><span class="ar">→</span></a></div>`;
const pill = `<div class="toprow"><div class="pill">${card.pill}</div><img class="wm-top" src="assets/logos/mm-wordmark.png" alt="Minds &amp; Models"></div>`;
const titleBlock = `<div>${card.q ? `<p class="q">${tagify(card.q)}</p>` : ''}<h1>${card.headline}</h1>${card.sub ? `<p class="sub">${tagify(card.sub)}</p>` : ''}</div>`;

let html;
if (FMT === 'slide') {
  html = `<div class="card">${pill}<div class="body"><div class="left">${titleBlock}${stat}</div><div class="viz">${viz(card.chart)}</div></div>${foot}</div>`;
} else {
  html = `<div class="card">${pill}<div class="head">${titleBlock}${FMT === 'pt' ? '' : stat}</div>${FMT === 'pt' ? `<div class="head" style="justify-content:flex-start">${stat.replace('class="stat"', 'class="stat" style="text-align:left"')}</div>` : ''}<div class="viz">${viz(card.chart)}</div>${foot}</div>`;
}
document.getElementById('root').innerHTML = `<div class="stage">${html}</div>`;
document.title = `${card.id} · ${FMT}`;
if (P.get('check')) {
  const c = document.querySelector('.card').getBoundingClientRect();
  const out = [...document.querySelectorAll('.card *')].filter(e => { const r = e.getBoundingClientRect(); return r.width && (r.right > c.right - 2 || r.bottom > c.bottom - 2 || r.left < c.left); }).map(e => e.className || e.tagName);
  const h1 = document.querySelector('h1'); const lh = parseFloat(getComputedStyle(h1).lineHeight);
  const viz = document.querySelector('.viz'); const vz = viz.getBoundingClientRect(); const kid = viz.firstElementChild?.getBoundingClientRect();
  const tagDelta = [...document.querySelectorAll('h1 .mn .nm')].map(nm => { const m1 = document.createElement('span'); m1.style.cssText = 'display:inline-block;width:0;height:0'; nm.appendChild(m1);
    const m2 = document.createElement('span'); m2.style.cssText = 'display:inline-block;width:0;height:0'; nm.closest('.mn').after(m2); return Math.round((m1.getBoundingClientRect().top - m2.getBoundingClientRect().top) * 10) / 10; });
  document.body.setAttribute('data-check', JSON.stringify({ tagDelta, overflow: [...new Set(out)].slice(0, 6), h1Lines: Math.round(h1.getBoundingClientRect().height / lh), vizFree: kid ? Math.round(vz.height - kid.height) : null }));
}
})();
</script>
</body>
</html>
