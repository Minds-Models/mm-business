            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

            const nextSlide = () => {
                if (currentSlideIndex < slides.length - 1) {
                    setCurrentSlideIndex(prev => prev + 1);
                }
            };

            const prevSlide = () => {
                if (currentSlideIndex > 0) {
                    setCurrentSlideIndex(prev => prev - 1);
                }
            };

            // Keyboard navigation
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentSlideIndex]);

            return (
                <div className="flex flex-col h-screen bg-[#050b14] p-4 md:p-8">
                    {/* Header bar */}
                    <div className="flex justify-between items-center mb-6 px-4">

                        <div className="text-slate-400 text-sm font-mono">
                            {currentSlideIndex + 1} / {slides.length}
                        </div>
                    </div>

                    {/* Main Slide Area */}
                    <div className="flex-grow flex items-center justify-center relative">
                        {/* Slide Container (Maintains 16:9 Aspect Ratio) */}
                        <div className="w-full max-w-6xl slide-container rounded-lg overflow-hidden relative">
                            {slides[currentSlideIndex].content}
                        </div>

                        {/* Navigation Overlay Arrows */}
                        <button 
                            onClick={prevSlide}
                            disabled={currentSlideIndex === 0}
                            className={`absolute left-4 p-4 rounded-full bg-slate-900/50 text-white hover:bg-brand-neonBlue hover:text-slate-900 transition-colors ${currentSlideIndex === 0 ? 'opacity-20 cursor-not-allowed' : 'opacity-100 cursor-pointer'}`}
                        >
                            <IconChevronLeft />
                        </button>
                        
                        <button 
                            onClick={nextSlide}
                            disabled={currentSlideIndex === slides.length - 1}
                            className={`absolute right-4 p-4 rounded-full bg-slate-900/50 text-white hover:bg-brand-neonBlue hover:text-slate-900 transition-colors ${currentSlideIndex === slides.length - 1 ? 'opacity-20 cursor-not-allowed' : 'opacity-100 cursor-pointer'}`}
                        >
                            <IconChevronRight />
                        </button>
                    </div>

                    {/* Footer / Old Deck Reference Note */}
                    <div className="mt-8 text-center px-4">
                        <p className="text-slate-500 text-sm">
                            Use <kbd className="bg-slate-800 px-2 py-1 rounded font-mono text-xs text-slate-300 mx-1">←</kbd> and <kbd className="bg-slate-800 px-2 py-1 rounded font-mono text-xs text-slate-300 mx-1">→</kbd> arrows to navigate.
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PitchDeckViewer />);
    </script>
</body>
</html>
