model_arr_curve:
  value: "Ending ARR: 175k (2026) · 955k (2027) · 4.39M (2028) · 9.78M (2029) · 15.10M (2030) · 19.21M (2031), EUR"
  source: "VC financial model, SUMMARY, read 2026-09-13 after the thirteenth pass"
  status: internal-estimate
  note: "Live run-rate ARR, not contracted ARR including LOIs. Seven markets in the base case; categories follow chains (2 at launch, 4 within 6 months). Revenue recognised 2031: 17.19M."

model_margins:
  value: "Gross margin 68.3% (2031); EBITDA +0.95M, 5.5% full-year 2031, 7.8% Q4 2031, 8.4% December 2031 annualised; EBITDA positive and stays positive from month 52 (Dec 2030)"
