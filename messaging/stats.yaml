  value: "2031: 40 live categories plus 17 market reads (57 sellable products) on 24 chains and 1,400 capture stores in 7 markets · 143 brand seats (114 labelled, 29 market reads) · 2.8 labelled seats per category · NRR 102% · LTV/CAC 5.8x · CAC payback 10.4 months · ARR per instrumented category 480k · ARR per chain deployed 800k · headcount 82, ARR per head 234k"
