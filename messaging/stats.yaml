  source: "VC financial model, SUMMARY section 1, read 2026-09-09"
  status: internal-estimate
  note: "Live run-rate ARR, not contracted ARR including LOIs. Definition differs from the older external curve. Revenue recognised 2031: 15.20M."

model_margins:
  value: "Gross margin 74.5% (2031); EBITDA +2.31M, 15.2% full-year 2031, 21.7% Q4 2031, 22.7% December 2031 annualised; EBITDA positive and stays positive from month 52 (Dec 2030)"
  source: "VC financial model, SUMMARY section 1"
  status: internal-estimate
  note: "Show the run-rate beside the full-year figure; 2031 still averages a loss-making January with a profitable December."

model_operating_metrics:
  value: "2031: 35 live categories plus 13 aggregated reads (48 sellable products) on 19 chains and 1,100 capture stores · 2.9 seats per slot, 137 brand seats · NRR 110% · LTV/CAC 8.4x · CAC payback 7.2 months · ARR per instrumented category 518k · headcount 74, ARR per head 245k"
