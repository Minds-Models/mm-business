model_capital:
  value: "Total capital raised across all sources 7,224,898 EUR; founders 55.1% and ESOP 6.1% at exit"
  source: "VC financial model, SUMMARY, read 2026-09-13 after the thirteenth pass"
  status: internal-estimate

model_rounds:
  value: "Pre-seed 500k at 6.5M post (Nov 2026) · Seed 2.6M at 12M post (Sep 2027, 21.7%) · Series A 4.0M at 30M post (Nov 2028, 13.3%)"
  source: "VC financial model, SUMMARY, read 2026-09-13 after the thirteenth pass"
  status: internal-estimate
