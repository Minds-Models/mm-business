# --- Added 2026-09-09 for the top-down market check on the pitch deck ---

niq_stated_tam:
  value: "The incumbent's own IPO filing sizes its combined TAM at $57bn for 2024: $18bn Consumer Measurement plus $39bn Consumer Analytics"
  source: "NIQ Global Intelligence Form S-1, SEC EDGAR, filed 2025 (accessed 2026-09-09)"
  status: verified
  note: >
    The $18bn Consumer Measurement line is the layer we sit in and is the anchor for the deck's
    top-down check. Citable because it is the incumbent's own filed estimate, not a third-party
    market report. Same filing: revenue $3.3bn FY23 and $4.0bn FY24, ~80% recurring, ~84% of
    Intelligence revenue on multi-year or annual subscriptions.

niq_client_arithmetic:
  value: "~23,000 client companies against $4.0bn FY24 revenue implies an average of about $173k per client per year"
  source: "NIQ Global Intelligence Form S-1 (client count and revenue); average is our arithmetic"
  status: verified
  note: "Label the average as implied, not disclosed. It is the price-point comparison for a brand seat."

market_check_ratio:
  value: "The 2031 plan is 137 brand seats, which is 0.6% of the incumbent's ~23,000 client companies"
  source: "seats = model ending ARR 18.12M / ARPU 132,575, read 2026-09-09; client count from the NIQ S-1"
  status: internal-estimate
  note: >
    The deck's top-down check. The point is that the plan needs a small share of buyers who
    already fund this category, not market growth and not a new budget line.

insights_industry_size:
  value: "Global insights industry $153bn in 2024, of which the market research sector is $56bn"
