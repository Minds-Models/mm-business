  source: "VC financial model, SUMMARY section 4"
  status: internal-estimate
  note: "Rounds are sized from the unfunded cash path: about six months of cover before the Series A, a 1.39M floor after it. Instrument is a term-sheet question and is not named in the model. Do NOT state the cap or the instrument in the deck unless asked."

